# Automatically creates a vX.Y.Z tag when code is pushed to main, then
# triggers the full release workflow.
#
# The version comes from package.json, so cutting a release is a version bump
# and a changelog stamp on an ordinary PR — nothing here needs to be run by
# hand. A push to main that does not change the version releases nothing, which
# is the intended behaviour: main stays mergeable without shipping an image
# every time.
#
# Tags pushed by GITHUB_TOKEN don't trigger `on: push: tags` workflows, so we
# call release.yml directly via workflow_call instead.
#
# The manual trigger is an escape hatch for two ways a release can silently not
# happen:
#
#   1. GitHub skips a whole push event when the commit message contains a
#      CI-skip directive — and squash-merging a PR concatenates every branch
#      commit message into the merge commit body. One routine commit on the
#      branch is enough to swallow the release, with no run and no failure to
#      notice.
#
#   2. Once the tag exists, a re-run finds it and no-ops, so the release can
#      never be retried for that version.
#
# Dispatch with `force` to release a version whose tag already exists.

name: Tag Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if the tag already exists
        type: boolean
        default: false

# release.yml needs contents:write to create the GitHub Release. This must be
# set at the top level because workflow_call inherits the caller's top-level
# permissions.
permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
      # Release when the tag is new, or when a manual run explicitly forces it
      # for a version that was already tagged but never actually shipped.
      release: ${{ steps.check_tag.outputs.exists == 'false' || inputs.force == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(grep '"version":' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.TAG }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG }}" -m "Release ${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.TAG }}"
          echo "Created tag ${{ steps.version.outputs.TAG }}"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
