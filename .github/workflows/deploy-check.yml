# Throwaway: proves the runner can join the tailnet and reach the hosts.
# Delete once a real release has deployed itself.
name: Deploy check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH to both hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for h in 100.110.246.86 100.83.151.102; do
            echo "--- $h"
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "alex@$h" \
              'hostname; docker ps --format "{{.Names}}" | head -3; docker compose version | head -1'
          done
