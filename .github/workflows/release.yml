# Release pipeline: on a v* tag, test, build all three images, then publish.
#
# Flow: test → build (no push) → push images → create the GitHub Release
#
# Building and pushing are separate phases on purpose. Barrelman ships three
# images that are only meaningful as a set — the API, the database and the ops
# worker are versioned together — and a single job that pushed as it went would
# leave a half-published release on Docker Hub if the third build failed. The
# push phase is a cache hit on what the build phase already produced.
#
# Tags: every image gets :<version> and :latest. Pin to :<version> to hold a
# deployment still; :latest is what an unattended puller follows.
#
# Production runs on vega2 (/opt/barrelman). As of 2026-08-06 vega2 runs
# Watchtower (/opt/watchtower), polling hourly, so a release reaches production
# on its own within ~1h of the images landing on Docker Hub. Each Watchtower
# only ever watches its own Docker socket — there is no cross-host updating —
# so this works because vega2 has its own instance, not because anything else
# on the homelab does.
#
# To roll out immediately instead of waiting for the poll:
#
#   ssh vega2 'cd /opt/barrelman && docker compose pull barrelman barrelman-ops && docker compose up -d barrelman barrelman-ops'
#
# CAVEAT: vega2's Watchtower is unfiltered — it updates every container on the
# host, not just Barrelman's. barrelman-motis and barrelman-graphhopper track
# :latest, and both bake data into a version-specific binary format, so an
# upstream release can restart them onto an engine that rejects the existing
# timetable / routing graph ("tt: binary version mismatch"). Recovery is an
# import job, not a restart — see "Updating a deployment" in README.md. This is
# also why the command above names services rather than pulling the whole
# stack. Pre-Watchtower image digests are recorded on the host at
# /opt/watchtower/pre-watchtower-digests.txt if you need to pin back.
#
# Required GitHub secrets:
#   DOCKERHUB_USERNAME  - Docker Hub username (e.g. alexwohlbruck)
#   DOCKERHUB_TOKEN     - Docker Hub access token (hub.docker.com → Account → Security → Access Tokens)

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  # A tag push names itself; a workflow_call from tag-release.yml passes the
  # tag it just created, because a tag pushed by GITHUB_TOKEN does not itself
  # trigger `on: push: tags`.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# ─── PHASE 1: TEST ────────────────────────────────────────────────────────────

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

# ─── PHASE 2: BUILD (no publishing) ──────────────────────────────────────────

  build:
    name: Build Docker images
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT

      - name: Build barrelman API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            alexwohlbruck/barrelman:${{ steps.version.outputs.VERSION }}
            alexwohlbruck/barrelman:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build barrelman-db
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            alexwohlbruck/barrelman-db:${{ steps.version.outputs.VERSION }}
            alexwohlbruck/barrelman-db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build barrelman-ops (console job worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ops
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            alexwohlbruck/barrelman-ops:${{ steps.version.outputs.VERSION }}
            alexwohlbruck/barrelman-ops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─── PHASE 3: PUBLISH ────────────────────────────────────────────────────────

  push-images:
    name: Push Docker images
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT

      - name: Push barrelman API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            alexwohlbruck/barrelman:${{ steps.version.outputs.VERSION }}
            alexwohlbruck/barrelman:latest
          cache-from: type=gha

      - name: Push barrelman-db
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            alexwohlbruck/barrelman-db:${{ steps.version.outputs.VERSION }}
            alexwohlbruck/barrelman-db:latest
          cache-from: type=gha

      - name: Push barrelman-ops (console job worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ops
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            alexwohlbruck/barrelman-ops:${{ steps.version.outputs.VERSION }}
            alexwohlbruck/barrelman-ops:latest
          cache-from: type=gha

  github-release:
    name: Create GitHub Release
    needs: [push-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        id: changelog
        # CHANGELOG.md is cumulative, so take only the newest version's section.
        run: |
          CHANGELOG=$(./scripts/changelog.sh latest || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${RELEASE_TAG}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo ""
            echo "Images: \`alexwohlbruck/barrelman:${RELEASE_TAG#v}\`, \`alexwohlbruck/barrelman-db:${RELEASE_TAG#v}\`, \`alexwohlbruck/barrelman-ops:${RELEASE_TAG#v}\`"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

  # ── Deploy ────────────────────────────────────────────────────────────
  #
  # Push the new images at the server instead of waiting for it to notice.
  # Watchtower polls hourly, so a release could sit unshipped for an hour and
  # then restart the stack at whatever moment the poll happened to land; this
  # deploys the moment the images exist, and only when the host says it is
  # safe.
  #
  # Unconfigured is not failed: without the secrets the job no-ops and
  # Watchtower's poll remains the way updates arrive. Required secrets:
  #
  #   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  Tailscale OAuth client (scope
  #     auth_keys, tag:ci) — the runner joins the tailnet as an ephemeral
  #     node so the host needs no public SSH port.
  #   DEPLOY_SSH_KEY                        private half of a keypair whose
  #     public half is in ~/.ssh/authorized_keys on the host.
  #
  # Tailscale SSH would remove DEPLOY_SSH_KEY entirely (the tailnet ACL
  # authorises `tag:ci` → the host, no key material in GitHub). It needs
  # `tailscale set --ssh` on the host, which is off there today.
  deploy:
    name: Deploy to production
    needs: [push-images]
    runs-on: ubuntu-latest
    env:
      # Tailnet IP, not a hostname: this tailnet has MagicDNS off, so `vega2`
      # does not resolve from the runner.
      DEPLOY_HOST: 100.110.246.86
      DEPLOY_USER: alex
      DEPLOY_PATH: /opt/barrelman
      # barrelman-db is deliberately absent. Restarting Postgres on a 27M-row
      # database is not a routine step, and its image changes rarely — when it
      # does, an operator recreates it by hand.
      DEPLOY_SERVICES: barrelman barrelman-ops
    steps:
      - name: Check for deploy credentials
        id: creds
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$TS_ID" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::Deploy secrets not set — skipping. Watchtower will pick this release up on its next poll."
          fi

      - name: Join the tailnet
        if: steps.creds.outputs.ready == 'true'
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load the deploy key
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Wait for the job queue to drain, then update
        if: steps.creds.outputs.ready == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SERVICES='$DEPLOY_SERVICES' bash -se" <<'REMOTE'
            set -euo pipefail

            # An import runs for minutes to hours and cannot be resumed, so the
            # deploy waits it out rather than killing it. Same question the
            # Watchtower pre-update hooks ask, asked from the other side.
            running=1
            for _ in $(seq 1 120); do
              running=$(docker exec barrelman-db psql -U barrelman -d barrelman -tAc \
                "SELECT count(*) FROM ops_jobs WHERE status = 'running'" 2>/dev/null || echo 1)
              [ "$running" = "0" ] && break
              echo "waiting: $running job(s) still running"
              sleep 60
            done
            if [ "$running" != "0" ]; then
              echo "still busy after two hours — leaving the running image in place"
              exit 1
            fi

            cd "$DEPLOY_PATH"
            docker compose pull $DEPLOY_SERVICES
            # --no-deps: recreate exactly the services named. Without it compose
            # reconciles their dependencies too, and a deploy that was meant to
            # touch the API bounces the database.
            docker compose up -d --no-deps $DEPLOY_SERVICES
          REMOTE

      - name: Verify
        if: steps.creds.outputs.ready == 'true'
        run: |
          ssh -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<'REMOTE'
            set -euo pipefail
            for _ in $(seq 1 30); do
              if curl -sf -m 10 localhost:5001/health | grep -q '"status":"ok"'; then
                echo "healthy"
                exit 0
              fi
              sleep 10
            done
            echo "did not come back healthy within five minutes"
            docker logs --tail 50 barrelman
            exit 1
          REMOTE
