# CI/CD pipeline for Barrelman
#
# Triggers on every push to main:
#   1. Runs tests
#   2. Builds and pushes Docker images to Docker Hub (tagged :latest + :<sha>)
#
# Production runs on vega2 (/opt/barrelman). As of 2026-08-06 vega2 runs
# Watchtower (/opt/watchtower), polling hourly, so a push to main reaches
# production on its own within ~1h of the image landing on Docker Hub. Each
# Watchtower only ever watches its own Docker socket — there is no cross-host
# updating — so this works because vega2 has its own instance, not because
# anything else on the homelab does.
#
# To roll out immediately instead of waiting for the poll:
#
#   ssh vega2 'cd /opt/barrelman && docker compose pull && docker compose up -d'
#
# CAVEAT: vega2's Watchtower is unfiltered — it updates every container on the
# host, not just Barrelman's. barrelman-motis and barrelman-graphhopper track
# :latest, and both bake data into a version-specific binary format, so an
# upstream release can restart them onto an engine that rejects the existing
# timetable / routing graph ("tt: binary version mismatch"). Recovery is an
# import job, not a restart — see "Updating a deployment" in README.md.
# Pre-Watchtower image digests are recorded on the host at
# /opt/watchtower/pre-watchtower-digests.txt if you need to pin back.
#
# Required GitHub secrets:
#   DOCKERHUB_USERNAME  - Docker Hub username (e.g. alexwohlbruck)
#   DOCKERHUB_TOKEN     - Docker Hub access token (hub.docker.com → Account → Security → Access Tokens)

name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  build-and-push:
    name: Build and push Docker images
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push barrelman API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            alexwohlbruck/barrelman:${{ github.sha }}
            alexwohlbruck/barrelman:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push barrelman-db
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            alexwohlbruck/barrelman-db:${{ github.sha }}
            alexwohlbruck/barrelman-db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push barrelman-ops (console job worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ops
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            alexwohlbruck/barrelman-ops:${{ github.sha }}
            alexwohlbruck/barrelman-ops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

