# Checks every pull request, and every push to dev, before it can reach a
# release. release.yml runs the unit tests again on a tag; this is the earlier
# gate, and the only place the console build and the integration tests run.

name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests, audit and console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same as release.yml, so a PR is tested by the bun that will test its tag.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      # Fails on any new high or critical advisory. The one ignored here is not
      # reachable from a request:
      #
      #   GHSA-mrhx-c7xc-m3w5  zod 3.x, pulled in by @elysiajs/swagger through
      #                        @scalar/types, which only validates the static
      #                        OpenAPI UI config at startup. The fix is zod 4,
      #                        which @scalar/types does not accept yet.
      #
      # Remove an entry once `bun audit` stops reporting it.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5

      - name: Install console dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Audit console dependencies
        working-directory: web
        run: bun audit --audit-level=high

      - name: Typecheck console
        working-directory: web
        run: bun run typecheck

      - name: Build console
        working-directory: web
        run: bun run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # PostGIS with nothing imported. The suites that bring their own fixtures
    # run in full: the schedule store's claim protocol, the drizzle-vs-DDL drift
    # check (on a scratch database), and route context (in a throwaway schema).
    # The ones that need imported OSM data (search, geocode, place, spatial,
    # admin, the search lexicon) find no tables, skip themselves, and say so in
    # the log.
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: barrelman
          POSTGRES_USER: barrelman
          POSTGRES_PASSWORD: barrelman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barrelman -d barrelman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://barrelman:barrelman@localhost:5432/barrelman
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The image's init script enables postgis in the default database. The
      # rest is what scripts/init-extensions.sh adds in barrelman-db, minus
      # pgvector, which no integration suite touches.
      - name: Enable extensions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' \
            -c 'CREATE EXTENSION IF NOT EXISTS unaccent'

      - name: Run integration tests
        run: bun run test:integration
