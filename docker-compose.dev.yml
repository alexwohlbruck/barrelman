# Development overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Adds:
#   - Build contexts so images are built locally instead of pulled from Docker Hub
#   - Source volume mounts for hot-reload (barrelman API)
#   - Import directory mount for quick iteration on import scripts
#   - The admin console Vite dev server (hot-reload UI) at :5199

services:
  barrelman-db:
    build:
      context: .
      dockerfile: Dockerfile.db

  martin:
    volumes:
      - ./data:/data
      - ./martin-config.yaml:/config/martin-config.yaml:ro

  barrelman:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./import:/app/import
      # config/regions.json is the seed + fallback for the import-region store,
      # read at startup by src/config/regions.ts. The production Dockerfile bakes
      # it in via `COPY . .`, but Dockerfile.dev copies only package.json and
      # relies on these mounts — without this the API dies on boot with an
      # uncaughtException from loadFile().
      - ./config:/app/config
      - ./data:/data
      - /app/node_modules

  # Admin console dev server (Vite + HMR). Dev-only — in production the API
  # serves the pre-built console at /console. Proxies /admin to the barrelman
  # service over the compose network. Open http://localhost:5199/console/ —
  # Vite is configured with base '/console/' and 404s without the trailing
  # slash, which production (served by Elysia) does not require.
  barrelman-console:
    container_name: barrelman-console
    image: oven/bun:1
    working_dir: /web
    command: sh -c "bun install --frozen-lockfile 2>/dev/null || bun install; exec bun run dev"
    environment:
      BARRELMAN_API_URL: http://barrelman:5001
    volumes:
      - ./web:/web
      - /web/node_modules
    ports:
      - "5199:5199"
    depends_on:
      - barrelman

  # Marketing site (Nuxt + HMR). Lives in its own repo, checked out alongside
  # this one — the same layout parchment/parchment-landing use.
  #
  # Behind the `landing` profile so `docker compose up` still works for anyone
  # who has only cloned barrelman: without the profile this service is skipped
  # rather than failing on a missing bind mount. `./start.sh dev` enables the
  # profile automatically when the sibling directory is there.
  barrelman-landing:
    container_name: barrelman-landing
    profiles: ["landing"]
    image: oven/bun:1
    working_dir: /site
    command: sh -c "bun install --frozen-lockfile 2>/dev/null || bun install; exec bun run dev"
    environment:
      # Point the site's links at the local API rather than production, so
      # "Get a key" lands on the console you are actually running.
      # Trailing slash is required: the console dev server is Vite with
      # base '/console/', and answers 404 with "did you mean /console/" for
      # the slashless form. Production serves it from Elysia and accepts both.
      NUXT_PUBLIC_CONSOLE_URL: http://localhost:5199/console/
      NUXT_PUBLIC_DOCS_URL: http://localhost:5001/docs
      NUXT_PUBLIC_API_URL: http://localhost:5001
      NUXT_PORT: "5200"
    volumes:
      - ../barrelman-landing:/site
      # Anonymous volumes so the container's installs never fight the host's —
      # the Linux binaries bun resolves here differ from the macOS ones outside.
      - /site/node_modules
      - /site/.nuxt
    ports:
      - "5200:5200"
