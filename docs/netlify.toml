# Netlify config for the Barrelman docs site (Next.js + Fumadocs).
# When linking this repo, set "Base directory" to "docs" in the Netlify UI.
#
# The plugin is declared here rather than left to auto-detection, which is what
# the note in its place used to assume. Netlify did identify the framework as
# `next` on its own, and still ran a bare `next build` and published the static
# assets with no server attached: 39 files, no functions, no redirect rules, and
# every route answering 404 — including `/`. The plugin is the part that turns
# `.next` into a served site, and `/api/search` is a dynamic route that cannot
# be a static file at all.
[build]
  # The clean is not superstition. Netlify restores build output between
  # deploys, and after the docs search endpoint moved off /api/search the old
  # route handler kept being emitted from cache — the deployed file list
  # carried both app/api/search/route-<hash>.js and app/docs-search/route with
  # the same hash, long after the source file was gone. The stale handler took
  # precedence over the catch-all and answered 500 on the one URL that
  # documents the API's own /search endpoint. A 13-page site builds in well
  # under a minute; the cache is not worth the class of bug it hides.
  command = "rm -rf .next .source && bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
