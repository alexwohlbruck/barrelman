# Pelias (address geocoder) is part of this stack rather than a sibling project,
# so it shares the network, shows up as one group, and is driven by one compose
# file. Its services sit behind profiles and do NOT start with a plain
# `docker compose up -d` — Elasticsearch alone wants a 1GB heap, and address
# search is optional:
#
#   docker compose --profile pelias up -d                     # + geocoder API
#   docker compose --profile pelias --profile pelias-full up -d   # + libpostal/pip/interpolation
#
# No env_file here on purpose: pelias/.env is gitignored, and referencing a
# missing file would break `docker compose up` on a fresh clone. The variables
# it would set have defaults inside pelias/docker-compose.yml instead.
include:
  - path: pelias/docker-compose.yml

volumes:
  barrelman-data:
  barrelman-osm-data:
  barrelman-gtfs-data:

services:
  barrelman-db:
    container_name: barrelman-db
    image: alexwohlbruck/barrelman-db:latest
    restart: unless-stopped
    # The stock postgres image ships shared_buffers=128MB — for a 23GB table
    # that means almost every search projection is a cold read, and it was the
    # difference between a 6.6s and a 0.2s FTS layer on an uncached query.
    #
    # Defaults here are deliberately small: on a dev box this database shares an
    # ~12GB Docker VM with MOTIS (~1.3GB), Elasticsearch (~1.7GB) and a
    # GraphHopper JVM that needs several GB of *native* memory to map a 2.5GB
    # routing graph. Overcommitting shared_buffers here starves GraphHopper's
    # JVM at startup, which fails as an OutOfMemoryError from its thread
    # allocator rather than anything that looks like a Postgres problem.
    #
    # Production wants roughly 25% of host RAM in shared_buffers and 50-75% in
    # effective_cache_size — set them in .env:
    #
    #   BARRELMAN_DB_SHARED_BUFFERS=8GB
    #   BARRELMAN_DB_CACHE_SIZE=24GB
    #   BARRELMAN_DB_WORK_MEM=128MB
    #
    # - work_mem: bitmap scans over geo_places went lossy at 4MB (78K lossy heap
    #   blocks forcing a recheck on 648K rows). Sized to hold the bitmap exactly.
    # - random_page_cost: 4 assumes a spinning disk and pushes the planner off
    #   index scans. 1.1 is the SSD/NVMe value.
    # - jit: measured at ~280ms of compilation on search queries that execute in
    #   single-digit milliseconds. Pure overhead for this workload.
    command: >
      postgres
      -c shared_buffers=${BARRELMAN_DB_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${BARRELMAN_DB_CACHE_SIZE:-3GB}
      -c work_mem=${BARRELMAN_DB_WORK_MEM:-64MB}
      -c maintenance_work_mem=${BARRELMAN_DB_MAINTENANCE_WORK_MEM:-1GB}
      -c random_page_cost=${BARRELMAN_DB_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=200
      -c jit=off
    environment:
      POSTGRES_DB: barrelman
      POSTGRES_USER: barrelman
      POSTGRES_PASSWORD: ${BARRELMAN_DB_PASSWORD:-barrelman}
      BARRELMAN_DATA_DIR: /data
    volumes:
      - barrelman-data:/var/lib/postgresql/data
      - barrelman-osm-data:/data
    ports:
      # Loopback by default. These four services have no authentication of
      # their own — Postgres accepts BARRELMAN_DB_PASSWORD (which defaults to
      # "barrelman"), and Martin, GraphHopper and MOTIS answer anyone who asks —
      # so publishing them on 0.0.0.0 puts the database and an unmetered copy of
      # the tile, routing and transit APIs on the public internet the moment the
      # host has no firewall. Only `barrelman` (5001) is meant to be reachable.
      # Override BARRELMAN_BIND_ADDR=0.0.0.0 to expose them deliberately.
      - "${BARRELMAN_BIND_ADDR:-127.0.0.1}:5434:5432"
    # Docker gives a container 64MB of /dev/shm, and Postgres puts parallel
    # query workers' shared memory there. The post-import index builds ask for
    # ~2GB and die with "could not resize shared memory segment ... No space
    # left on device" — which reads like a disk problem on a host with 200GB
    # free.
    #
    # This counts against mem_limit below. The budget the container must fit is
    # roughly shared_buffers + shm_size + maintenance_work_mem, and exceeding it
    # gets Postgres OOM-killed mid-index-build, surfacing as a bare
    # "connection to server was lost". Raise this with maintenance_work_mem,
    # and raise mem_limit with both.
    shm_size: ${BARRELMAN_DB_SHM_SIZE:-1gb}
    # Keeps Postgres from squeezing MOTIS, Elasticsearch and GraphHopper on a
    # dev machine. Headroom over shared_buffers for work_mem allocations and
    # per-backend overhead. Raise or drop it in production, where the database
    # should own the box.
    mem_limit: ${BARRELMAN_DB_MEM_LIMIT:-2g}

  martin:
    container_name: barrelman-martin
    # Deliberately unpinned. Martin renders tiles from PostGIS on each request
    # and persists nothing of its own, so there is no baked artifact for a new
    # release to invalidate — unlike MOTIS and GraphHopper below.
    image: ghcr.io/maplibre/martin
    restart: unless-stopped
    command: --config /config/martin-config.yaml --webui enable-for-all
    environment:
      # statement_timeout caps tile queries — an abandoned HTTP request must
      # not keep grinding in Postgres for minutes (scoped to martin's
      # connections only; imports use their own connections).
      DATABASE_URL: postgresql://barrelman:${BARRELMAN_DB_PASSWORD:-barrelman}@barrelman-db:5432/barrelman?options=-c%20statement_timeout%3D10s
    volumes:
      - barrelman-osm-data:/data
      - ./martin-config.yaml:/config/martin-config.yaml:ro
    ports:
      - "${BARRELMAN_BIND_ADDR:-127.0.0.1}:5002:3000"
    depends_on:
      - barrelman-db

  graphhopper:
    container_name: barrelman-graphhopper
    image: israelhikingmap/graphhopper:latest
    restart: unless-stopped
    # -i and -o must be passed explicitly; the entrypoint script defaults
    # graph.location to /data/default-gh otherwise, ignoring our config value.
    command: ["-i", "/data/region.osm.pbf", "-o", "/data/graph-cache"]
    environment:
      JAVA_OPTS: "${GRAPHHOPPER_JAVA_OPTS:--Xmx6g -Xms1g}"
    volumes:
      - barrelman-osm-data:/data
      - ./graphhopper-config.yml:/graphhopper/config-example.yml:ro
      - ./custom_models:/graphhopper/custom_models:ro
    ports:
      - "${BARRELMAN_BIND_ADDR:-127.0.0.1}:5003:8989"
    depends_on:
      - barrelman-db

  motis:
    container_name: barrelman-motis
    # MOTIS bakes its timetable into a versioned binary format and refuses to
    # start when engine and data disagree — "tt: binary version mismatch
    # [existing=34 vs expected=37], please re-run import". So a `docker compose
    # pull` that moves :latest takes transit routing down until the timetable is
    # rebuilt from the GTFS feeds (`motis import`), which is a job, not a
    # restart. Same shape as GraphHopper's graph-cache above.
    # Deliberately still :latest — pinning would freeze every downstream user on
    # whatever version shipped with their compose file. Re-import after an
    # upgrade instead.
    image: ghcr.io/motis-project/motis:latest
    restart: unless-stopped
    working_dir: /data
    command: ["/motis", "server", "/data"]
    volumes:
      - barrelman-gtfs-data:/data
      - barrelman-osm-data:/osm-data:ro
      # The feeds themselves. generate-motis-config.ts writes dataset paths as
      # "gtfs/<id>.zip", relative to MOTIS's working dir /data — but /data is the
      # gtfs-data volume, which holds only config.yml. Without this bind the ZIPs
      # exist for barrelman and barrelman-ops and are invisible here, and
      # `motis import` exits 1 having printed its config and nothing else.
      - ./data/gtfs:/data/gtfs:ro
    ports:
      - "${BARRELMAN_BIND_ADDR:-127.0.0.1}:5004:8080"

  barrelman:
    container_name: barrelman
    image: alexwohlbruck/barrelman:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://barrelman:${BARRELMAN_DB_PASSWORD:-barrelman}@barrelman-db:5432/barrelman
      # Caps runaway queries on the API query pool only — schema DDL and the
      # enrichment backfill get their own untimed connections (see src/db.ts).
      BARRELMAN_STATEMENT_TIMEOUT_MS: ${BARRELMAN_STATEMENT_TIMEOUT_MS:-10000}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      PORT: 5001
      BARRELMAN_API_KEY: ${BARRELMAN_API_KEY:-brm_dev_changeme}
      GRAPHHOPPER_URL: http://barrelman-graphhopper:8989
      MOTIS_URL: http://barrelman-motis:8080
      # Both default to the compose service names in code, so they only need
      # naming here so an operator CAN point them elsewhere — a shared Martin,
      # or a Pelias stack on another host.
      MARTIN_URL: ${MARTIN_URL:-http://barrelman-martin:3000}
      PELIAS_URL: ${PELIAS_URL:-http://pelias_api:4000}
      # GTFS-RT poll interval baked into motis/config.yml at import time. Unset →
      # MOTIS default 60s. Set in .env (e.g. 600) to throttle dev polling.
      MOTIS_RT_UPDATE_INTERVAL: ${MOTIS_RT_UPDATE_INTERVAL:-}
      GTFS_DATA_DIR: /gtfs-zips
      # Portolan corrected-geometry tiles: static MVT pyramids written by
      # `portolan sync` (run in barrelman-ops) into the shared workspace,
      # served by this container at /tiles/portolan/… . Missing dir → the
      # routes answer 404, so this is safe on a stack that never runs portolan.
      PORTOLAN_TILES_DIR: /portolan-data/build/tiles
      # Parallel GraphHopper calls per isochrone. Documented in
      # https://docs.barrelman.dev/self-hosting/configuration; without this line it had no effect in a container.
      ISOCHRONE_CONCURRENCY: ${ISOCHRONE_CONCURRENCY:-}

      # The origin /docs advertises as its "Production" server, so the docs'
      # try-it button points at the real API rather than only localhost.
      # src/config/swagger.ts has read this since the docs shipped, but it was
      # never named here — so it has never had any effect in a container.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

      # Raises the GitHub API rate limit used when resolving a region's
      # OpenAddresses file list (60 req/hour unauthenticated). Optional, but a
      # rate-limited lookup yields an empty address list rather than an error.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # ── Public API accounts ──────────────────────────────────────────
      # Compose does not forward the host environment, so every variable the
      # app reads has to be named here or it is silently absent inside the
      # container — the symptom is a setting that is documented, present in
      # .env, and has no effect.
      NODE_ENV: ${NODE_ENV:-}
      BARRELMAN_ACCOUNTS_ENABLED: ${BARRELMAN_ACCOUNTS_ENABLED:-}
      BARRELMAN_SERVER_ORIGIN: ${BARRELMAN_SERVER_ORIGIN:-}
      BARRELMAN_CONSOLE_ORIGIN: ${BARRELMAN_CONSOLE_ORIGIN:-}
      BARRELMAN_ALLOWED_ORIGINS: ${BARRELMAN_ALLOWED_ORIGINS:-}
      BARRELMAN_REGISTRATION_MODE: ${BARRELMAN_REGISTRATION_MODE:-}
      BARRELMAN_SESSION_TTL_DAYS: ${BARRELMAN_SESSION_TTL_DAYS:-}
      BARRELMAN_OTP_TTL_MINUTES: ${BARRELMAN_OTP_TTL_MINUTES:-}
      BARRELMAN_SIGNUPS_PER_IP_PER_DAY: ${BARRELMAN_SIGNUPS_PER_IP_PER_DAY:-}
      BARRELMAN_TEST_ACCOUNT_EMAIL: ${BARRELMAN_TEST_ACCOUNT_EMAIL:-}

      # ── Email (sign-in codes) ────────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # ── OAuth ────────────────────────────────────────────────────────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}

      # ── Licensing ────────────────────────────────────────────────────
      # Signed token granting the `billing` feature. Only the official
      # deployment holds one; the Commons Clause forbids selling access to a
      # self-hosted instance (LICENSING.md). Without it the Polar settings
      # below do nothing.
      BARRELMAN_LICENSE: ${BARRELMAN_LICENSE:-}
      # Overrides the public key baked into src/lib/license.ts. Only needed to
      # verify tokens from a different keypair (a test license, a re-key);
      # Compose does not forward host env on its own, so without this line the
      # variable the code reads could never arrive.
      BARRELMAN_LICENSE_PUBLIC_KEY: ${BARRELMAN_LICENSE_PUBLIC_KEY:-}

      # ── Billing (requires a license, see above) ──────────────────────
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID:-}
      POLAR_SANDBOX: ${POLAR_SANDBOX:-}
      POLAR_DEVELOPER_PRODUCT_ID: ${POLAR_DEVELOPER_PRODUCT_ID:-}
      POLAR_BUSINESS_PRODUCT_ID: ${POLAR_BUSINESS_PRODUCT_ID:-}
      POLAR_SCALE_PRODUCT_ID: ${POLAR_SCALE_PRODUCT_ID:-}
      POLAR_CREDIT_PACKS: ${POLAR_CREDIT_PACKS:-}
      POLAR_USAGE_EVENT_NAME: ${POLAR_USAGE_EVENT_NAME:-}
      POLAR_METER_USAGE: ${POLAR_METER_USAGE:-}

      # How long /health reuses its dependency probes — the endpoint is public
      # and fans out to five services without it.
      BARRELMAN_HEALTH_CACHE_MS: ${BARRELMAN_HEALTH_CACHE_MS:-}

      # ── Scheduled jobs ───────────────────────────────────────────────
      # The schedules themselves live in the database (console → Schedules);
      # these only set the default timezone offered and the poll cadence.
      BARRELMAN_SCHEDULE_TZ: ${BARRELMAN_SCHEDULE_TZ:-}
      BARRELMAN_SCHEDULER_INTERVAL_MS: ${BARRELMAN_SCHEDULER_INTERVAL_MS:-}

      # ── Metering and abuse controls ──────────────────────────────────
      BARRELMAN_USAGE_FLUSH_MS: ${BARRELMAN_USAGE_FLUSH_MS:-}
      BARRELMAN_BALANCE_CACHE_MS: ${BARRELMAN_BALANCE_CACHE_MS:-}
      BARRELMAN_OVERAGE_REPORT_MS: ${BARRELMAN_OVERAGE_REPORT_MS:-}
      BARRELMAN_ACCOUNT_SWEEP_MS: ${BARRELMAN_ACCOUNT_SWEEP_MS:-}
      BARRELMAN_TRUSTED_PROXY_HOPS: ${BARRELMAN_TRUSTED_PROXY_HOPS:-}
      BARRELMAN_ANON_RPM: ${BARRELMAN_ANON_RPM:-}
      BARRELMAN_IP_RPM: ${BARRELMAN_IP_RPM:-}
      BARRELMAN_PER_KEY_SHARE: ${BARRELMAN_PER_KEY_SHARE:-}
      BARRELMAN_ISOCHRONE_CONCURRENCY_PER_ACCOUNT: ${BARRELMAN_ISOCHRONE_CONCURRENCY_PER_ACCOUNT:-}
      BARRELMAN_TRANSIT_CONCURRENCY_PER_ACCOUNT: ${BARRELMAN_TRANSIT_CONCURRENCY_PER_ACCOUNT:-}
      BARRELMAN_ROUTING_CONCURRENCY_PER_ACCOUNT: ${BARRELMAN_ROUTING_CONCURRENCY_PER_ACCOUNT:-}
      BARRELMAN_ABUSE_STRIKES: ${BARRELMAN_ABUSE_STRIKES:-}
      BARRELMAN_ABUSE_SIGNAL_STRIKES: ${BARRELMAN_ABUSE_SIGNAL_STRIKES:-}
      BARRELMAN_BURN_RATE_MULTIPLE: ${BARRELMAN_BURN_RATE_MULTIPLE:-}
      BARRELMAN_BURN_RATE_SUSPEND_MULTIPLE: ${BARRELMAN_BURN_RATE_SUSPEND_MULTIPLE:-}
      BARRELMAN_AUTO_SUSPEND_HOURS: ${BARRELMAN_AUTO_SUSPEND_HOURS:-}
      BARRELMAN_MULTI_ACCOUNT_THRESHOLD: ${BARRELMAN_MULTI_ACCOUNT_THRESHOLD:-}

      # ── Terms of service ─────────────────────────────────────────────
      BARRELMAN_TOS_URL: ${BARRELMAN_TOS_URL:-}
      BARRELMAN_TOS_VERSION: ${BARRELMAN_TOS_VERSION:-}
      BARRELMAN_PRIVACY_URL: ${BARRELMAN_PRIVACY_URL:-}
    ports:
      # Defaults to every interface, unlike the sibling services above: this is
      # the one port that is meant to serve traffic. Note what that implies on a
      # fresh public server — the console and open sign-up answer the internet as
      # soon as the stack is up, and the first account created becomes an admin.
      # Set BARRELMAN_API_BIND_ADDR=127.0.0.1 once a reverse proxy fronts it (the
      # proxy reaches this container as barrelman:5001 over the Compose network,
      # so nothing breaks). A host firewall is NOT a substitute — Docker DNATs
      # published ports before ufw's INPUT rules are consulted.
      - "${BARRELMAN_API_BIND_ADDR:-0.0.0.0}:5001:5001"
    volumes:
      - barrelman-osm-data:/data
      - barrelman-gtfs-data:/gtfs-data
      - ./data/gtfs:/gtfs-zips:ro
      # Read-only: the API only serves tiles from here; barrelman-ops owns the
      # writes (same split as ./data/gtfs above).
      - ./data/portolan:/portolan-data:ro
    depends_on:
      - barrelman-db

  # Privileged operator worker: executes the console's `process` script-jobs
  # (OSM/GTFS/stop-areas/routing) which drive sibling containers. The lean
  # barrelman API only enqueues; this claims + runs them (single-flight, with
  # live logs streamed to the DB job queue). Mounts the docker socket so its
  # scripts can `docker exec`/`restart` barrelman-db, graphhopper, motis, etc.
  barrelman-ops:
    container_name: barrelman-ops
    image: alexwohlbruck/barrelman-ops:latest
    build:
      context: .
      dockerfile: Dockerfile.ops
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://barrelman:${BARRELMAN_DB_PASSWORD:-barrelman}@barrelman-db:5432/barrelman
      BARRELMAN_DB_PASSWORD: ${BARRELMAN_DB_PASSWORD:-barrelman}
      GRAPHHOPPER_URL: http://barrelman-graphhopper:8989
      MOTIS_URL: http://barrelman-motis:8080
      TRANSITLAND_API_KEY: ${TRANSITLAND_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # The one variable that decides coverage. Read by the importers that run
      # here, not by the API — see https://docs.barrelman.dev/self-hosting/regions.
      REGIONS: ${REGIONS:-}
      GTFS_DATA_DIR: /gtfs-zips
      # Where the shared OSM volume is mounted in THIS container. The scripts
      # default to <repo>/data, which is /app/data here and holds nothing —
      # prepare-motis-osm.sh failed with "region.osm.pbf not found" while the
      # file sat in the volume all along. barrelman-db gets the equivalent
      # BARRELMAN_DATA_DIR baked into its image.
      OSM_DATA_DIR: /data
      BARRELMAN_DATA_DIR: /data
      # Refresh knobs for scripts/update-osm.sh and scripts/init-replication.sh.
      # Those scripts `source ../.env`, which works when they are run from a host
      # checkout but never here — .env is in .dockerignore, so /app/.env does not
      # exist in this image. Without these three lines, setting them in .env is a
      # silent no-op and both scripts fall back to their built-in defaults.
      UPDATE_MODE: ${UPDATE_MODE:-}
      GEOFABRIK_URL: ${GEOFABRIK_URL:-}
      GEOFABRIK_REPLICATION_URL: ${GEOFABRIK_REPLICATION_URL:-}
      # ── Portolan (corrected transit geometry) ───────────────────────
      # Workspace root for import/portolan-sync.ts: portolan.json + style/ +
      # data/gtfs/ (raw feeds, portolan's own copies) + build/ (tiles, exports,
      # sync state). Lives under ./data/portolan on the host.
      PORTOLAN_WORKSPACE: /portolan-data
      # The portolan binary is NOT baked into this image — it is a single
      # static Go binary from a separate repo (see Dockerfile.ops). Drop a
      # linux build at ./data/portolan/bin/portolan on the host, or point this
      # somewhere else.
      PORTOLAN_BIN: ${PORTOLAN_BIN:-/portolan-data/bin/portolan}
      # scripts/*.sh docker-exec into these sibling containers by name.
      DB_CONTAINER: barrelman-db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - barrelman-osm-data:/data
      - barrelman-gtfs-data:/gtfs-data
      # scripts/generate-pelias-config.ts rewrites pelias/pelias.json, and the
      # Pelias services bind-mount that file from the host. pelias/ is in
      # .dockerignore (it holds tens of GB of index under pelias/data), so
      # without this mount the script dies on ENOENT /app/pelias/pelias.json —
      # and a write inside the container could never reach the file the geocoder
      # actually reads.
      - ./pelias:/app/pelias
      # Read-WRITE, unlike the API's mount of the same directory: this is the
      # container that downloads the feeds. With :ro every download failed with
      # "EROFS: read-only file system" and the run ended "Processed 0 feeds".
      - ./data/gtfs:/gtfs-zips
      # Portolan workspace, read-write: `portolan sync` (run from here) writes
      # builds, tile pyramids and corrected GTFS exports into it. The API
      # mounts the same directory :ro to serve the tiles.
      - ./data/portolan:/portolan-data
    depends_on:
      - barrelman-db
