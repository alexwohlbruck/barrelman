volumes:
  barrelman-data:
  barrelman-osm-data:
  barrelman-gtfs-data:

services:
  barrelman-db:
    container_name: barrelman-db
    image: alexwohlbruck/barrelman-db:latest
    restart: unless-stopped
    # The stock postgres image ships shared_buffers=128MB — for a 23GB table
    # that means almost every search projection is a cold read, and it was the
    # difference between a 6.6s and a 0.2s FTS layer on an uncached query.
    #
    # Defaults here are deliberately small: on a dev box this database shares an
    # ~12GB Docker VM with MOTIS (~1.3GB), Elasticsearch (~1.7GB) and a
    # GraphHopper JVM that needs several GB of *native* memory to map a 2.5GB
    # routing graph. Overcommitting shared_buffers here starves GraphHopper's
    # JVM at startup, which fails as an OutOfMemoryError from its thread
    # allocator rather than anything that looks like a Postgres problem.
    #
    # Production wants roughly 25% of host RAM in shared_buffers and 50-75% in
    # effective_cache_size — set them in .env:
    #
    #   BARRELMAN_DB_SHARED_BUFFERS=8GB
    #   BARRELMAN_DB_CACHE_SIZE=24GB
    #   BARRELMAN_DB_WORK_MEM=128MB
    #
    # - work_mem: bitmap scans over geo_places went lossy at 4MB (78K lossy heap
    #   blocks forcing a recheck on 648K rows). Sized to hold the bitmap exactly.
    # - random_page_cost: 4 assumes a spinning disk and pushes the planner off
    #   index scans. 1.1 is the SSD/NVMe value.
    # - jit: measured at ~280ms of compilation on search queries that execute in
    #   single-digit milliseconds. Pure overhead for this workload.
    command: >
      postgres
      -c shared_buffers=${BARRELMAN_DB_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${BARRELMAN_DB_CACHE_SIZE:-3GB}
      -c work_mem=${BARRELMAN_DB_WORK_MEM:-64MB}
      -c maintenance_work_mem=${BARRELMAN_DB_MAINTENANCE_WORK_MEM:-1GB}
      -c random_page_cost=${BARRELMAN_DB_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=200
      -c jit=off
    environment:
      POSTGRES_DB: barrelman
      POSTGRES_USER: barrelman
      POSTGRES_PASSWORD: ${BARRELMAN_DB_PASSWORD:-barrelman}
      BARRELMAN_DATA_DIR: /data
    volumes:
      - barrelman-data:/var/lib/postgresql/data
      - barrelman-osm-data:/data
    ports:
      - "5434:5432"
    # Keeps Postgres from squeezing MOTIS, Elasticsearch and GraphHopper on a
    # dev machine. Headroom over shared_buffers for work_mem allocations and
    # per-backend overhead. Raise or drop it in production, where the database
    # should own the box.
    mem_limit: ${BARRELMAN_DB_MEM_LIMIT:-2g}

  martin:
    container_name: barrelman-martin
    image: ghcr.io/maplibre/martin
    restart: unless-stopped
    command: --config /config/martin-config.yaml --webui enable-for-all
    environment:
      # statement_timeout caps tile queries — an abandoned HTTP request must
      # not keep grinding in Postgres for minutes (scoped to martin's
      # connections only; imports use their own connections).
      DATABASE_URL: postgresql://barrelman:${BARRELMAN_DB_PASSWORD:-barrelman}@barrelman-db:5432/barrelman?options=-c%20statement_timeout%3D10s
    volumes:
      - barrelman-osm-data:/data
      - ./martin-config.yaml:/config/martin-config.yaml:ro
    ports:
      - "5002:3000"
    depends_on:
      - barrelman-db

  graphhopper:
    container_name: barrelman-graphhopper
    image: israelhikingmap/graphhopper:latest
    restart: unless-stopped
    # -i and -o must be passed explicitly; the entrypoint script defaults
    # graph.location to /data/default-gh otherwise, ignoring our config value.
    command: ["-i", "/data/region.osm.pbf", "-o", "/data/graph-cache"]
    environment:
      JAVA_OPTS: "${GRAPHHOPPER_JAVA_OPTS:--Xmx6g -Xms1g}"
    volumes:
      - barrelman-osm-data:/data
      - ./graphhopper-config.yml:/graphhopper/config-example.yml:ro
      - ./custom_models:/graphhopper/custom_models:ro
    ports:
      - "8989:8989"
    depends_on:
      - barrelman-db

  motis:
    container_name: barrelman-motis
    # Pinned by digest for the same reason graphhopper is: `motis server` does
    # not read motis/config.yml, it reads the *baked* /data/data/config.yml and
    # the dataset built alongside it. An upstream :latest bump can therefore
    # drop in a binary whose on-disk dataset format the existing bake no longer
    # matches, and the container crash-loops the moment it is recreated —
    # exactly how a GraphHopper 11 -> 12 bump invalidated the graph cache.
    #
    # Digest below == tag 2.10.2 (== 2.10 == :latest as of 2026-07-30).
    # Bumping it may require redoing the MOTIS data prep/bake before the
    # server will start: scripts/prepare-motis-osm.sh, then re-run the import
    # (`motis import`) so /data/data is regenerated by the new binary.
    image: ghcr.io/motis-project/motis@sha256:f1757c12ddec0ed182e5b4efb57d4049508c3ec55e5fc98f83dac2678b20ef77
    restart: unless-stopped
    working_dir: /data
    command: ["/motis", "server", "/data"]
    volumes:
      - barrelman-gtfs-data:/data
      - barrelman-osm-data:/osm-data:ro
    ports:
      - "8080:8080"

  barrelman:
    container_name: barrelman
    image: alexwohlbruck/barrelman:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://barrelman:${BARRELMAN_DB_PASSWORD:-barrelman}@barrelman-db:5432/barrelman
      # Caps runaway queries on the API query pool only — schema DDL and the
      # enrichment backfill get their own untimed connections (see src/db.ts).
      BARRELMAN_STATEMENT_TIMEOUT_MS: ${BARRELMAN_STATEMENT_TIMEOUT_MS:-10000}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      PORT: 5001
      BARRELMAN_API_KEY: ${BARRELMAN_API_KEY:-brm_dev_changeme}
      # Admin console auth (gates /console + script/job routes). Falls back to
      # BARRELMAN_API_KEY when unset. Set a strong, separate secret in prod.
      BARRELMAN_ADMIN_KEY: ${BARRELMAN_ADMIN_KEY:-}
      # BARRELMAN_TILE_KEY: Set in .env for production. When unset, tile access is open (dev mode).
      BARRELMAN_TILE_KEY: ${BARRELMAN_TILE_KEY:-}
      GRAPHHOPPER_URL: http://barrelman-graphhopper:8989
      MOTIS_URL: http://barrelman-motis:8080
      # GTFS-RT poll interval baked into motis/config.yml at import time. Unset →
      # MOTIS default 60s. Set in .env (e.g. 600) to throttle dev polling.
      MOTIS_RT_UPDATE_INTERVAL: ${MOTIS_RT_UPDATE_INTERVAL:-}
      GTFS_DATA_DIR: /gtfs-zips
    ports:
      - "5001:5001"
    volumes:
      - barrelman-osm-data:/data
      - barrelman-gtfs-data:/gtfs-data
      - ./data/gtfs:/gtfs-zips:ro
    depends_on:
      - barrelman-db

  # Privileged operator worker: executes the console's `process` script-jobs
  # (OSM/GTFS/stop-areas/routing) which drive sibling containers. The lean
  # barrelman API only enqueues; this claims + runs them (single-flight, with
  # live logs streamed to the DB job queue). Mounts the docker socket so its
  # scripts can `docker exec`/`restart` barrelman-db, graphhopper, motis, etc.
  barrelman-ops:
    container_name: barrelman-ops
    image: alexwohlbruck/barrelman-ops:latest
    build:
      context: .
      dockerfile: Dockerfile.ops
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://barrelman:${BARRELMAN_DB_PASSWORD:-barrelman}@barrelman-db:5432/barrelman
      BARRELMAN_DB_PASSWORD: ${BARRELMAN_DB_PASSWORD:-barrelman}
      GRAPHHOPPER_URL: http://barrelman-graphhopper:8989
      MOTIS_URL: http://barrelman-motis:8080
      TRANSITLAND_API_KEY: ${TRANSITLAND_API_KEY:-}
      REGIONS: ${REGIONS:-}
      GTFS_DATA_DIR: /gtfs-zips
      # scripts/*.sh docker-exec into these sibling containers by name.
      DB_CONTAINER: barrelman-db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - barrelman-osm-data:/data
      - barrelman-gtfs-data:/gtfs-data
      - ./data/gtfs:/gtfs-zips:ro
    depends_on:
      - barrelman-db
