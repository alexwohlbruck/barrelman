# Martin tile server configuration
# Serves vector tiles from PostGIS geo_places, plus an optional PMTiles basemap.
#
# ⚠ Do NOT copy this file over a running deployment's copy.
#
# This is the defaults-for-a-fresh-install version. A deployment's config is a
# host file (bind-mounted at ./martin-config.yaml), not something an image
# update touches, so it drifts on purpose — a real one is likely to have the
# pmtiles basemap below *enabled*, and to have dropped source entries whose
# relations that instance has never built. Overwriting it wholesale therefore
# removes the basemap and every other local decision along with it.
#
# To roll out a new source: append just that entry to the deployment's own
# file, create its relation first, and restart Martin afterwards — it resolves
# its source list at startup, so a Martin restarted before the relation exists
# will not pick it up.

# Optional basemap.
#
# Martin treats an unresolvable source as FATAL and exits, so naming a file that
# is not there crash-loops martin and takes down EVERY tile source, not just
# this one:
#
#   Source basemap: IO error No such file or directory (os error 2):
#   /data/basemap.pmtiles
#
# So this block and the file must be kept in step, and it ships commented out
# because a fresh install has no archive. To turn a basemap on: build the first
# one with "Rebuild Basemap" in the console with "Build even if none exists"
# on (or `BASEMAP_FORCE=1 ./scripts/rebuild-basemap.sh`), then uncomment.
#
# Unlike every source under `postgres:` below, this one is a static archive
# rather than a live query. scripts/rebuild-basemap.sh is what keeps it in step
# with the database — it runs automatically after an import, and after an OSM
# update that moved the extract. Enabling this block without that archive on
# disk is the crash-loop above; building it without enabling the block renders
# 700 MB that nothing serves.
#
# pmtiles:
#   sources:
#     basemap: /data/basemap.pmtiles

postgres:
  connection_string: ${DATABASE_URL}

  tables:
    parchment_pois:
      schema: public
      table: geo_places
      srid: 4326
      geometry_column: centroid
      geometry_type: POINT
      # No id_column. PostGIS requires the MVT feature-id column to be an
      # integer, and geo_places.id is text ("node/4021155832"), so declaring it
      # made every tile request fail with:
      #   mvt_agg_transfn: Could not find column 'id' of integer type
      # The id is still carried as a property below, which is what a client
      # needs to look the place up again.
      minzoom: 10
      maxzoom: 16
      properties:
        id: id
        name: name
        categories: categories
        geom_type: geom_type
      buffer: 64
      clip_geom: true

    parchment_boundaries:
      schema: public
      table: geo_places
      srid: 4326
      geometry_column: geom
      minzoom: 4
      maxzoom: 14
      properties:
        id: id
        name: name
        admin_level: admin_level
        geom_type: geom_type
      buffer: 64
      clip_geom: true

    parchment_roads:
      schema: public
      table: geo_places
      srid: 4326
      geometry_column: geom
      minzoom: 6
      maxzoom: 16
      properties:
        id: id
        name: name
        geom_type: geom_type
      buffer: 64
      clip_geom: true

    parchment_buildings:
      schema: public
      table: geo_places
      srid: 4326
      geometry_column: geom
      minzoom: 14
      maxzoom: 16
      properties:
        id: id
        name: name
        geom_type: geom_type
      buffer: 64
      clip_geom: true

    parchment_water:
      schema: public
      table: geo_places
      srid: 4326
      geometry_column: geom
      minzoom: 8
      maxzoom: 16
      properties:
        id: id
        name: name
        geom_type: geom_type
      buffer: 64
      clip_geom: true

    bicycle_ways:
      schema: public
      table: bicycle_ways
      srid: 4326
      geometry_column: geom
      geometry_type: LINESTRING
      id_column: osm_id
      minzoom: 9
      maxzoom: 16
      properties:
        name: name
        infra_type: infra_type
        highway: highway
        cycleway: cycleway
        cycleway_left: cycleway_left
        cycleway_right: cycleway_right
        bicycle: bicycle
        surface: surface
        state: state
        oneway: oneway
        bridge: bridge
        tunnel: tunnel
      buffer: 64
      clip_geom: true

    bicycle_routes:
      schema: public
      table: bicycle_routes
      srid: 4326
      geometry_column: geom
      geometry_type: MULTILINESTRING
      id_column: osm_id
      minzoom: 5
      maxzoom: 14
      properties:
        name: name
        ref: ref
        network: network
        route_type: route_type
      buffer: 64
      clip_geom: true

    parchment_landuse:
      schema: public
      table: geo_places
      srid: 4326
      geometry_column: geom
      minzoom: 10
      maxzoom: 16
      properties:
        id: id
        name: name
        geom_type: geom_type
      buffer: 64
      clip_geom: true

    transit_station_buildings:
      schema: public
      table: transit_station_buildings
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
      id_column: fid
      bounds: [-84.0, 33.0, -73.0, 42.0]
      minzoom: 13
      maxzoom: 16
      properties:
        id: id
        name: name
        geom_type: geom_type
        railway: railway
        public_transport: public_transport
        building_type: building_type
        station_type: station_type
        network: network
        operator: operator
      buffer: 64
      clip_geom: true

    transit_platforms:
      schema: public
      table: transit_platforms
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
      id_column: fid
      bounds: [-84.0, 33.0, -73.0, 42.0]
      minzoom: 14
      maxzoom: 16
      properties:
        id: id
        name: name
        geom_type: geom_type
        railway: railway
        public_transport: public_transport
        ref: ref
        wheelchair: wheelchair
        level: level
      buffer: 64
      clip_geom: true

    transit_entrances:
      schema: public
      table: transit_entrances
      srid: 4326
      geometry_column: centroid
      geometry_type: POINT
      id_column: fid
      bounds: [-84.0, 33.0, -73.0, 42.0]
      minzoom: 14
      maxzoom: 16
      properties:
        id: id
        name: name
        railway_type: railway_type
        entrance_type: entrance_type
        wheelchair: wheelchair
        level: level
        description: description
        ref: ref
        network: network
        operator: operator
      buffer: 64
      clip_geom: true

    # ── Map detail (import/create-detail-views.sql) ──────────────────────
    # Trees, parking surfaces and street furniture. OpenMapTiles has no schema
    # for any of it, so the basemap can't carry them and they are served here
    # as their own sources. Zoom ranges match the client's source definitions —
    # these are dense enough that a level lower would be a very large tile.
    #
    # No `bounds`: unlike the transit views these aren't tied to a region with
    # a known extent, and a self-hoster importing anywhere else would get empty
    # tiles from a hardcoded one.

    parking_areas:
      schema: public
      table: parking_areas
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
      id_column: fid
      minzoom: 13
      maxzoom: 16
      properties:
        id: id
        parking: parking
      buffer: 64
      clip_geom: true

    street_trees:
      schema: public
      table: street_trees
      srid: 4326
      geometry_column: centroid
      geometry_type: POINT
      id_column: fid
      minzoom: 16
      maxzoom: 17
      properties:
        id: id
        leaf_type: leaf_type
        genus: genus
        species: species
        taxon: taxon
        height: height
        est_height: est_height
        diameter_crown: diameter_crown
        circumference: circumference
        denotation: denotation
      buffer: 64
      clip_geom: true

    tree_rows:
      schema: public
      table: tree_rows
      srid: 4326
      geometry_column: geom
      geometry_type: GEOMETRY
      id_column: fid
      minzoom: 16
      maxzoom: 17
      properties:
        id: id
        leaf_type: leaf_type
        genus: genus
        species: species
        taxon: taxon
        height: height
        est_height: est_height
        diameter_crown: diameter_crown
        circumference: circumference
        denotation: denotation
      buffer: 64
      clip_geom: true

    street_furniture:
      schema: public
      table: street_furniture
      srid: 4326
      geometry_column: centroid
      geometry_type: POINT
      id_column: fid
      minzoom: 17
      maxzoom: 17
      properties:
        id: id
        kind: kind
        direction: direction
      buffer: 64
      clip_geom: true
