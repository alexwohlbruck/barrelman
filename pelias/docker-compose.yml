# Included by barrelman's root docker-compose.yml (`include:`), so these run as
# part of the barrelman project — same network, same `docker compose` invocation,
# one group in Docker UIs. No `name:` and no external network declaration: both
# are inherited from the including project, which is what puts pelias_api on the
# same network the barrelman API reaches it over.
#
# Still usable standalone for provisioning (`pelias import all` and friends run
# from this directory). Set COMPOSE_PROJECT_NAME=barrelman in pelias/.env so the
# CLI operates on the same project rather than creating a second one.
#
# Profiles — nothing here starts on a plain `docker compose up -d`:
#   pelias        the running geocoder (api + elasticsearch)
#   pelias-full   heavier services behind /v1/search & /v1/reverse (~4GB)
#   pelias-tools  one-shot importers; invoked via `docker compose run`, which
#                 activates their profile automatically
services:
  # Barrelman only calls /v1/autocomplete, which needs just api + elasticsearch
  # (the `pelias` profile). libpostal/placeholder/interpolation/pip serve
  # /v1/search & /v1/reverse and together held ~4GB (mostly swap), so they sit
  # behind `pelias-full`. To bring the complete geocoder up:
  #   docker compose --profile pelias --profile pelias-full up -d
  libpostal:
    image: pelias/libpostal-service
    container_name: pelias_libpostal
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    ports: ['127.0.0.1:4400:4400']

  schema:
    image: pelias/schema:master
    container_name: pelias_schema
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      # TODO: Custom synonyms
      # - './synonyms/custom_name.txt:/code/pelias/schema/synonyms/custom_name.txt'
      # - './synonyms/custom_street.txt:/code/pelias/schema/synonyms/custom_street.txt'
      - './pelias.json:/code/pelias.json'

  api:
    image: pelias/api:master
    container_name: pelias_api
    profiles: ['pelias']
    user: '${DOCKER_USER:-}'
    restart: always
    environment: ['PORT=4000']
    ports: ['0.0.0.0:4000:4000']
    volumes:
      - './pelias.json:/code/pelias.json'

  placeholder:
    image: pelias/placeholder:master
    container_name: pelias_placeholder
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    environment: ['PORT=4100']
    ports: ['127.0.0.1:4100:4100']
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  whosonfirst:
    image: pelias/whosonfirst:master
    container_name: pelias_whosonfirst
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  openstreetmap:
    image: pelias/openstreetmap:master
    container_name: pelias_openstreetmap
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  openaddresses:
    image: pelias/openaddresses:master
    container_name: pelias_openaddresses
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  # transit:
  #   image: pelias/transit:master
  #   container_name: pelias_transit
  #   user: '${DOCKER_USER:-}'
  #   volumes:
  #     - './pelias.json:/code/pelias.json'
  #     - '${DATA_DIR:-./data}:/data'

  csv-importer:
    image: pelias/csv-importer:master
    container_name: pelias_csv_importer
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  polylines:
    image: pelias/polylines:master
    container_name: pelias_polylines
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'

  interpolation:
    image: pelias/interpolation:master
    container_name: pelias_interpolation
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    environment: ['PORT=4300']
    ports: ['127.0.0.1:4300:4300']
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'

  pip:
    image: pelias/pip-service:master
    container_name: pelias_pip-service
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    environment: ['PORT=4200']
    ports: ['127.0.0.1:4200:4200']
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'

  elasticsearch:
    image: pelias/elasticsearch:7.17.27
    container_name: pelias_elasticsearch
    profiles: ['pelias']
    user: '${DOCKER_USER:-}'
    restart: always
    # Default 512m heap GC-thrashed on autocomplete queries. 1g is enough —
    # Lucene serves the index from OS page cache, not heap, and the Docker VM
    # is memory-tight (going higher just adds swap pressure, which is what
    # actually caused the observed multi-second es_took outliers).
    environment: ['ES_JAVA_OPTS=-Xms1g -Xmx1g']
    ports: ['127.0.0.1:9200:9200', '127.0.0.1:9300:9300']
    volumes:
      - '${DATA_DIR:-./data}/elasticsearch:/usr/share/elasticsearch/data'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add: ['IPC_LOCK']

  fuzzy-tester:
    image: pelias/fuzzy-tester:master
    container_name: pelias_fuzzy_tester
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    restart: 'no'
    command: '--help'
    volumes:
      - './pelias.json:/code/pelias.json'
      - './test_cases:/code/pelias/fuzzy-tester/test_cases'
