# Included by barrelman's root docker-compose.yml (`include:`), so these run as
# part of the barrelman project — same network, same `docker compose` invocation,
# one group in Docker UIs. No `name:` and no external network declaration: both
# are inherited from the including project, which is what puts pelias_api on the
# same network the barrelman API reaches it over.
#
# Still usable standalone for provisioning (`pelias import all` and friends run
# from this directory). Set COMPOSE_PROJECT_NAME=barrelman in pelias/.env so the
# CLI operates on the same project rather than creating a second one.
#
# Profiles — nothing here starts on a plain `docker compose up -d`:
#   pelias        the running geocoder (api + elasticsearch)
#   pelias-full   heavier services behind /v1/search & /v1/reverse (~4GB)
#   pelias-tools  one-shot importers; invoked via `docker compose run`, which
#                 activates their profile automatically
#
# Pelias publishes no release tags for most of these, only rolling ones
# (:master, :latest), so each image is pinned to the digest its tag pointed at
# when it was last checked. See "Upgrading pinned images" in
# docs/content/docs/self-hosting/operations.mdx before moving them.
services:
  # Barrelman only calls /v1/autocomplete, which needs just api + elasticsearch
  # (the `pelias` profile). libpostal/placeholder/interpolation/pip serve
  # /v1/search & /v1/reverse and together held ~4GB (mostly swap), so they sit
  # behind `pelias-full`. To bring the complete geocoder up:
  #   docker compose --profile pelias --profile pelias-full up -d
  libpostal:
    image: pelias/libpostal-service:latest@sha256:72beeef72e968a7865ad7538854d900de7aa9cf27f3de899f29c00cd4a4d96fe
    container_name: pelias_libpostal
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    ports: ['127.0.0.1:4400:4400']

  schema:
    image: pelias/schema:master@sha256:94f8bd16723d9c89cddbb4bbb63cd9ee42880c4c9d6806e18372426261549583
    container_name: pelias_schema
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      # TODO: Custom synonyms
      # - './synonyms/custom_name.txt:/code/pelias/schema/synonyms/custom_name.txt'
      # - './synonyms/custom_street.txt:/code/pelias/schema/synonyms/custom_street.txt'
      - './pelias.json:/code/pelias.json'

  api:
    image: pelias/api:master@sha256:b2de2f1dea2a701b6b6649f8bfcde37f2f17ba320a574eb9dc9c083333eff983
    container_name: pelias_api
    profiles: ['pelias']
    user: '${DOCKER_USER:-}'
    restart: always
    environment: ['PORT=4000']
    # Bound to loopback, like every other service in this file and in the root
    # compose file. This used to publish on 0.0.0.0, which put an open geocoder
    # on the public internet as soon as the pelias profile was turned on.
    # Nothing needs the host port: barrelman reaches it as pelias_api:4000 over
    # the Compose network.
    ports: ['${BARRELMAN_BIND_ADDR:-127.0.0.1}:4000:4000']
    volumes:
      - './pelias.json:/code/pelias.json'

  placeholder:
    image: pelias/placeholder:master@sha256:69f687fa20ed21bca67012ef618ec9890bb33409d3b792fd1de24df116552cd4
    container_name: pelias_placeholder
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    environment: ['PORT=4100']
    ports: ['127.0.0.1:4100:4100']
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  whosonfirst:
    image: pelias/whosonfirst:master@sha256:2c25febcf46c5caf7e02071aaa3aeecc0e352c49e43a49ad92000ac0fd37b98e
    container_name: pelias_whosonfirst
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  openstreetmap:
    image: pelias/openstreetmap:master@sha256:0450f00cb9df46426e1286eed98b21f2565f42c2ef78f6fb6ca9e9d306452da2
    container_name: pelias_openstreetmap
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  openaddresses:
    image: pelias/openaddresses:master@sha256:83b3654cbd09a824fc4cfaeee584471eee1e6c6c66cfad80ffcd40e2b061c0e9
    container_name: pelias_openaddresses
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  # transit:
  #   image: pelias/transit:master@sha256:02d9d6d1db1eab8d455adfdc49dac3da5276e460dae2ba0507c56896012ec7f0
  #   container_name: pelias_transit
  #   user: '${DOCKER_USER:-}'
  #   volumes:
  #     - './pelias.json:/code/pelias.json'
  #     - '${DATA_DIR:-./data}:/data'

  csv-importer:
    image: pelias/csv-importer:master@sha256:af3137c51a3dbe7f87b787afa0c84acac8422d449113be4230964edc9abcb754
    container_name: pelias_csv_importer
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'
      - './blacklist/:/data/blacklist'

  polylines:
    image: pelias/polylines:master@sha256:9689d416dc4f56a04a4bb1eb69ec0d14e8f9c30eb742e898565f92fe1ea5497f
    container_name: pelias_polylines
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'

  interpolation:
    image: pelias/interpolation:master@sha256:daad2460638960ecb81b00148385c9e0520b8094b217c71ee21f87396c7c6d4d
    container_name: pelias_interpolation
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    environment: ['PORT=4300']
    ports: ['127.0.0.1:4300:4300']
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'

  pip:
    image: pelias/pip-service:master@sha256:91bba48a0de975489e68cf848e2954ce36b0ffc67bda47bb92bb84b7ef0491c4
    container_name: pelias_pip-service
    user: '${DOCKER_USER:-}'
    restart: always
    profiles: ['pelias-full']
    environment: ['PORT=4200']
    ports: ['127.0.0.1:4200:4200']
    volumes:
      - './pelias.json:/code/pelias.json'
      - '${DATA_DIR:-./data}:/data'

  elasticsearch:
    image: pelias/elasticsearch:7.17.27@sha256:8aa3c622abd74192eceaf53e9a3dfd51c1a75e50ee7a537d7f912aa7f80bab05
    container_name: pelias_elasticsearch
    profiles: ['pelias']
    user: '${DOCKER_USER:-}'
    restart: always
    # Default 512m heap GC-thrashed on autocomplete queries. 1g is enough —
    # Lucene serves the index from OS page cache, not heap, and the Docker VM
    # is memory-tight (going higher just adds swap pressure, which is what
    # actually caused the observed multi-second es_took outliers).
    environment: ['ES_JAVA_OPTS=-Xms1g -Xmx1g']
    ports: ['127.0.0.1:9200:9200', '127.0.0.1:9300:9300']
    volumes:
      - '${DATA_DIR:-./data}/elasticsearch:/usr/share/elasticsearch/data'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add: ['IPC_LOCK']

  fuzzy-tester:
    image: pelias/fuzzy-tester:master@sha256:cb710bcfa0b0f76d664d6c3fd484a0987fdda490ae3ac107a4d5283fa84bfb8a
    container_name: pelias_fuzzy_tester
    profiles: ['pelias-tools']
    user: '${DOCKER_USER:-}'
    restart: 'no'
    command: '--help'
    volumes:
      - './pelias.json:/code/pelias.json'
      - './test_cases:/code/pelias/fuzzy-tester/test_cases'
